name: Build UltraSweeper for PC

# Pushing a version tag (for example v4.1.1) builds UltraSweeper and UltraSweeper Lite for Windows (an installer exe)
# and Linux (.deb) and publishes them together as a Release.
# It can also be run by hand from the Actions tab; then the files are only kept as downloadable artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/set-version.js

      - name: Build UltraSweeper.exe
        run: npm run build

      - name: Build UltraSweeper-Lite.exe
        run: npm run build:lite

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSweeper-windows
          path: |
            dist/UltraSweeper.exe
            dist/UltraSweeper-Lite.exe

  linux:
    # Ubuntu 22.04 matches Linux Mint 21, so the build also runs on older Mint versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version.js

      - name: Build UltraSweeper.deb
        run: npm run build:linux

      - name: Build UltraSweeper-Lite.deb
        run: npm run build:lite:linux

      - name: Check the .deb files install and both games start
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./dist/UltraSweeper.deb ./dist/UltraSweeper-Lite.deb
          for game in ultrasweeper ultrasweeper-lite; do
            set +e
            xvfb-run -a timeout 20 "$game"
            code=$?
            set -e
            # 124 means it was still running when the 20 seconds ran out, i.e. it started fine.
            if [ "$code" != "124" ]; then echo "$game exited early with code $code"; exit 1; fi
            echo "$game ran for 20 seconds without crashing."
          done

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSweeper-linux
          path: |
            dist/UltraSweeper.deb
            dist/UltraSweeper-Lite.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            files/UltraSweeper.exe files/UltraSweeper.deb \
            files/UltraSweeper-Lite.exe files/UltraSweeper-Lite.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "UltraSweeper ${GITHUB_REF_NAME#v}" \
            --notes "**Windows:** download **UltraSweeper.exe** and open it. It installs the game and asks where to put it and whether you want a desktop and Start menu shortcut.
          If Windows shows \"Windows protected your PC\", click **More info** → **Run anyway** (the exe isn't code-signed).

          **Linux Mint / Ubuntu:** download **UltraSweeper.deb**, double-click it and click **Install Package**. UltraSweeper then appears in your app menu under Games.

          **UltraSweeper Lite** is the lighter version for older or slower PCs. Same steps, with **UltraSweeper-Lite.exe** or **UltraSweeper-Lite.deb**."
